<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Archive</title>

<link rel="apple-touch-icon" href="images/apple-touch-icon(memo_blue).png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Day Log">

<script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js" defer></script>

<style>
:root {
  --card-bg: #ffffff;
  --text-main: #1a1a1a;
  --text-muted: #666666;
  --line-color: #e0e0e0;
  --hyundai-blue: #002c5f;
  --mini-red: #C8102E; 

  --dynamic-app-bg: #002147;
  --dynamic-memo-bg: #ffffff;
  --dynamic-btn-main: #002147;
  --dynamic-btn-sub: #888888;
  --dynamic-border: #C8102E;
  --dynamic-text-color: #ffffff; 
}

* { box-sizing: border-box; margin:0; padding:0; }

body, html {
  width: 100%;
  min-height: 100%; 
  background-color: var(--dynamic-app-bg);
  background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0);
  background-size: 24px 24px;
  font-family: 'Pretendard', -apple-system, sans-serif;
  transition: background-color 0.8s ease;
  -webkit-tap-highlight-color: transparent; 
}

.app-container {
  width: 100%;
  max-width: 600px; 
  margin: 0 auto; 
  min-height: 100dvh; 
  padding: calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 24px); 
  display: flex;
  flex-direction: column;
  position: relative;
}

h2 { 
  color: var(--dynamic-text-color); 
  text-align: center; margin: 0 0 12px 0; font-size: 1.1rem; font-weight: 900; 
  letter-spacing: 1px; text-transform: uppercase; cursor: pointer; 
  transition: transform 0.1s ease-in-out; 
  user-select: none;
}
h2:active { transform: scale(0.95); }

.rainbow-theme {
  background: linear-gradient(to right, #FF3B30 0%, #FF3B30 14.28%, #FF9500 14.28%, #FF9500 28.57%, #FFCC00 28.57%, #FFCC00 42.85%, #4CD964 42.85%, #5AC8FA 57.14%, #5AC8FA 71.42%, #007AFF 71.42%, #007AFF 85.71%, #5856D6 85.71%, #5856D6 100%, #ffffff 100%, #ffffff 200%);
  background-size: 200% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: transparent; animation: sweepRainbow 2s ease-in-out forwards;
}
@keyframes sweepRainbow { 0% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

#dashboard { 
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; 
  flex: 1; align-content: stretch; 
}

.card {
  background: var(--card-bg); border-radius: 12px; padding: 12px;
  display: flex; flex-direction: column; justify-content: space-between; align-items: center;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3); border-top: 5px solid var(--dynamic-border); transition: border-top 0.8s ease, background-color 0.8s ease;
}

.reminder-card { grid-column: span 2; border-top: 5px solid var(--dynamic-border); background-color: var(--dynamic-memo-bg); padding: 10px 12px; min-height: 180px; }

.stat-card { 
  aspect-ratio: 1 / 1; 
  height: auto; 
  overflow: hidden; 
}

.card-title { font-size: 11px; font-weight: 800; color: var(--dynamic-btn-main); margin-bottom: 2px; transition: color 0.8s ease; }

.status-value { 
  color: var(--text-main); flex: 1; display: flex; flex-direction: column;
  justify-content: center; align-items: center; text-align: center; padding-top: 4px; 
}
.status-main { font-size: 16px; font-weight: 900; line-height: 1; display: block; }
.status-sub { font-size: 11px; color: #888; font-weight: 600; line-height: 1; margin-top: 6px; display: block; }

input, button { border: none; border-radius: 6px; outline: none; }
input { width: 100%; background: #f0f0f0; border: 1px solid var(--line-color); color: var(--text-main); padding: 8px; margin-top: 4px; font-size: 13px; text-align: center; }

button { 
  font-weight: 800; color: white; cursor: pointer; position: relative; overflow: hidden; z-index: 1; 
  transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), filter 0.1s ease, background-color 0.3s ease; 
}
button:active {
  transform: scale(0.93); 
  filter: brightness(0.85); 
}

.loading, .loading-add, .loading-del {
  background-color: transparent !important;
  background-image: linear-gradient(124deg, #ff9a9e 0%, #fecfef 25%, #f6e58d 50%, #a1c4fd 75%, #e0c3fc 100%) !important;
  background-size: 300% 300% !important;
  color: transparent !important; 
  border-color: transparent !important;
  animation: dreamySparkle 1.5s ease-in-out infinite alternate !important;
  pointer-events: none; 
  transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1) !important; 
}
@keyframes dreamySparkle { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

.btn-carwash, .btn-hair, .btn-fuel, .btn-robot {
  width: 100%; height: 34px; margin-top: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px;
  background-color: var(--dynamic-btn-main); 
  transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), filter 0.1s ease, background-color 0.8s ease, border-color 0.8s ease, color 0.8s ease;
}
.btn-carwash, .btn-hair { border: 1.5px solid transparent; }
.btn-fuel, .btn-robot { color: #fff; border: 1.5px solid var(--dynamic-btn-main); position: relative; overflow: hidden; background-repeat: no-repeat; }

.date-wrapper { position: relative; width: 100%; margin-top: 8px; height: 34px; }
.date-wrapper:active .btn-hair {
  transform: scale(0.93);
  filter: brightness(0.85);
}

.todo-input-group { display: flex; width: 100%; gap: 6px; margin-top: 8px; align-items: center; }

/* 터치 시 메모 스크롤 허용 및 모바일 최적화 (토글과 사이즈 조절 결합) */
.todo-list { 
  margin-top: 8px; 
  flex: 1; 
  overflow-y: auto; 
  -webkit-overflow-scrolling: touch; 
  overscroll-behavior-y: contain; 
  height: 120px; /* 평상시(접힌 상태)의 고정 높이 */
  --expanded-height: 350px; /* 펼친 상태의 기본 높이 변수 */
  width: 100%; 
  transition: height 0.4s cubic-bezier(0.25, 1, 0.5, 1); 
}
/* 드래그 중일 때는 애니메이션 제거 (버벅임 방지) */
.todo-list.no-transition {
  transition: none !important;
}

.todo-list::-webkit-scrollbar {
  width: 3px;
}
.todo-list::-webkit-scrollbar-track {
  background: transparent;
}
.todo-list::-webkit-scrollbar-thumb {
  background-color: #cccccc;
  border-radius: 4px;
}

/* expanded-view 클래스가 붙으면 사용자가 조절한 변수 값만큼만 펼쳐짐 */
.todo-list.expanded-view { 
  height: var(--expanded-height) !important; 
}

.todo-item { 
  display: flex; justify-content: space-between; align-items: center; 
  padding: 4px 0px; 
  border-bottom: 1px solid var(--line-color); 
  border-radius: 8px; transition: background-color 0.3s ease; 
  user-select: none;
  touch-action: pan-y; 
}
.todo-item.highlighted span.text, .todo-item.highlighted .drag-handle { color: #FF9500 !important; font-weight: 800 !important; }

.todo-item span.text { 
  flex: 1; text-align: left; color: var(--text-main); font-size: 13px; 
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
  cursor: pointer; line-height: 1.2; transition: color 0.2s ease;
  padding: 4px 0; 
}

.todo-item.expanded span.text { 
  white-space: normal !important; 
  overflow: visible !important; 
  text-overflow: clip !important;
}

.todo-input-group button, .todo-item button { width: 44px; height: 28px; display: flex; align-items: center; justify-content: center; margin: 0; font-size: 11px; font-weight: 800; border-radius: 6px; flex-shrink: 0; position: relative; overflow: hidden; background-repeat: no-repeat; }
.todo-input-group button { background-color: var(--dynamic-btn-main); border: 1.5px solid var(--dynamic-btn-main); }
.todo-item button { background-color: var(--dynamic-btn-sub); border: 1.5px solid var(--dynamic-btn-sub); }

.drag-handle { 
  color: #ccc; cursor: grab; padding-right: 8px; font-size: 14px; user-select: none; transition: color 0.2s ease; padding: 3px 12px 3px 0; 
  touch-action: none; 
}

/* 박스 사이즈 조절 핸들바 */
.resize-handle {
  width: 40px;
  height: 5px;
  background-color: var(--line-color);
  border-radius: 3px;
  margin: 10px auto 0;
  cursor: row-resize;
  touch-action: none; /* 드래그 방해 방지 */
}

@media (min-width: 768px) {
  .app-container { max-width: 768px; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
  #dashboard { grid-template-columns: repeat(4, 1fr); }
  .reminder-card { grid-column: span 4; }
  .stat-card { height: auto; aspect-ratio: 1 / 1; }
}
</style>

<script>
function applyTimeBasedThemeFixed() {
  const hour = new Date().getHours();
  const root = document.documentElement;
  let s;
  if (hour >= 6 && hour < 14) s = { bg: '#002147', border: '#C8102E', sub: '#6B7A8F' };
  else if (hour >= 14 && hour < 22) s = { bg: '#F0F1F2', border: '#A63333', sub: '#6B7A8F' };
  else s = { bg: '#458C98', border: '#A7292D', sub: '#80B5BE' };

  root.style.setProperty('--dynamic-app-bg', s.bg);
  if (s.bg === '#F0F1F2') {
    root.style.setProperty('--dynamic-text-color', '#2C3E50');
    root.style.setProperty('--dynamic-btn-main', '#2C3E50'); 
  } else {
    root.style.setProperty('--dynamic-text-color', '#ffffff');
    root.style.setProperty('--dynamic-btn-main', s.bg);
  }
  root.style.setProperty('--dynamic-border', s.border);
  root.style.setProperty('--dynamic-memo-bg', '#ffffff');
  root.style.setProperty('--dynamic-btn-sub', s.sub); 
}
applyTimeBasedThemeFixed();
</script>
</head>

<body>
<div class="app-container">
  <h2 id="log-it-title" onclick="toggleMedication()">My Day Log</h2>
  <div id="dashboard">
    <div class="card reminder-card">
      <div style="position: relative; width: 100%; text-align: center; margin-bottom: 2px;">
        <div class="card-title" onclick="toggleReminders()" style="cursor: pointer; user-select: none; margin-bottom: 0; display: inline-block;">📌 REMINDERS</div>
        <div id="week-dots" style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; gap: 4px;"></div>
      </div>
      <div class="todo-input-group">
        <input type="text" id="todo-input" placeholder="아이디어를 기록하세요.">
        <button id="btn-add-todo" onclick="addTodo(this)">추가</button>
      </div>
      <div id="todo-list" class="todo-list"></div>
      <div class="resize-handle" id="resize-handle"></div>
    </div>

    <div class="card stat-card">
      <div class="card-title">🤖 ROBOT</div>
      <div class="status-value" id="robot-status"></div>
      <button class="btn-robot" onclick="recordAction('addRobot', this)">청소 기록</button>
    </div>

    <div class="card stat-card">
      <div class="card-title">✂ HAIR CUT</div>
      <div class="status-value" id="hair-status"></div>
      <div class="date-wrapper">
        <button class="btn-hair" id="btn-hair" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; pointer-events: none; margin-top: 0;">날짜선택</button>
        <input type="date" id="hairDateVal" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;" onchange="recordHairCut()">
      </div>
    </div>

    <div class="card stat-card">
      <div class="card-title">🫧 CAR WASH</div>
      <div class="status-value" id="carwash-status"></div>
      <button class="btn-carwash" onclick="recordCarWash(this)">차감</button>
    </div>

    <div class="card stat-card">
      <div class="card-title">🚗 FUEL</div>
      <div class="status-value" id="fuel-status"></div>
      <button class="btn-fuel" onclick="recordAction('addFuel', this)">주유 기록</button>
    </div>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzLWAe2d1nzDkIHC0sofc17vqREcy3hQxHewu0dTkhSlDAYYICv-twP1RiDwFux5xiinA/exec'; 

function loadInitialData() {
  fetch(`${GAS_URL}?action=getInitialData&_t=${Date.now()}`)
    .then(res => res.json())
    .then(res => {
      if (res.status === 'success') {
        const d = res.data;
        const titleEl = document.getElementById('log-it-title');
        if (d.isMedicationTaken) titleEl.classList.add('rainbow-theme');
        else titleEl.classList.remove('rainbow-theme');

        document.getElementById('fuel-status').innerHTML = `<span class="status-main">${d.fuel} / 3회</span>`;
        const rDate = d.robotDate ? d.robotDate.substring(5).replace('-','/') : "날짜";
        document.getElementById('robot-status').innerHTML = `<span class="status-main">${d.robot} / 2회</span><span class="status-sub">(${rDate})</span>`;
        document.getElementById('carwash-status').innerHTML = `<span class="status-main" style="white-space: nowrap; font-size: 15px; letter-spacing: -0.5px;">${(d.carWash || 0).toLocaleString()}원/12,000원</span>`;
        document.getElementById('hair-status').innerHTML = getHaircutStatus(d.hairCutDate);

        const list = document.getElementById('todo-list'); 
        
        // 서버에서 저장된 높이값이 있으면 '펼침 상태의 기본 변수'로 설정
        if (d.reminderHeight) {
          list.style.setProperty('--expanded-height', d.reminderHeight + 'px');
        }

        list.innerHTML = '';
        const todos = res.todos.list;
        const highlighted = res.todos.highlighted;

        [...todos].reverse().forEach((text, i) => {
          const div = document.createElement('div');
          div.className = 'todo-item' + (highlighted.includes(text) ? ' highlighted' : '');
          div.innerHTML = `<span class="drag-handle">☰</span><span class="text">${text}</span><button onclick="deleteTodo(${todos.length - 1 - i}, this)">삭제</button>`;

          const handle = div.querySelector('.drag-handle');
          handle.onclick = (e) => {
            e.stopPropagation();
            div.classList.toggle('highlighted');
            if(navigator.vibrate) navigator.vibrate(50);
            fetch(`${GAS_URL}?action=toggleHighlight&text=${encodeURIComponent(text)}`);
          };

          const textField = div.querySelector('.text');
          textField.onclick = (e) => {
            e.stopPropagation();
            div.classList.toggle('expanded');
          };

          list.appendChild(div);
        });
        new Sortable(list, { handle: '.drag-handle', animation: 150, onEnd: saveOrder });
      }
    });
}

function loadAll() { 
  loadInitialData(); 
  renderWeekDots(); 
  initResizeHandler(); 
}

// 사이즈 조절 기능 
function initResizeHandler() {
  const handle = document.getElementById('resize-handle');
  const list = document.getElementById('todo-list');
  let isResizing = false;
  let startY, startHeight;

  const startDrag = (e) => {
    isResizing = true;
    
    // 접혀있을 때 하단 바를 드래그하면 자동으로 '펼침' 상태로 전환
    if (!list.classList.contains('expanded-view')) {
      list.classList.add('expanded-view');
    }
    
    startY = e.type.includes('mouse') ? e.pageY : e.touches[0].pageY;
    
    // 현재 설정된 펼침 높이(--expanded-height) 값을 가져옴
    let currentVar = list.style.getPropertyValue('--expanded-height');
    startHeight = currentVar ? parseInt(currentVar, 10) : list.offsetHeight;
    
    list.classList.add('no-transition'); // 드래그 중 버벅임 방지
  };

  const doDrag = (e) => {
    if (!isResizing) return;
    const currentY = e.type.includes('mouse') ? e.pageY : e.touches[0].pageY;
    let newHeight = startHeight + (currentY - startY);
    
    if(newHeight < 150) newHeight = 150; // 최소 펼침 높이
    if(newHeight > 800) newHeight = 800; // 최대 펼침 높이
    
    // 직접 높이가 아닌 '펼침 변수값'을 업데이트
    list.style.setProperty('--expanded-height', newHeight + 'px');
  };

  const stopDrag = () => {
    if (isResizing) {
      isResizing = false;
      list.classList.remove('no-transition'); 
      
      const finalHeight = parseInt(list.style.getPropertyValue('--expanded-height'), 10);
      fetch(`${GAS_URL}?action=setReminderHeight&height=${finalHeight}`);
    }
  };

  handle.addEventListener('mousedown', startDrag);
  handle.addEventListener('touchstart', startDrag, { passive: true });
  window.addEventListener('mousemove', doDrag);
  window.addEventListener('touchmove', doDrag, { passive: true });
  window.addEventListener('mouseup', stopDrag);
  window.addEventListener('touchend', stopDrag);
}

function renderWeekDots() {
  const now = new Date();
  const dayOfWeek = now.getDay();
  const daysUntilSunday = dayOfWeek === 0 ? 0 : 7 - dayOfWeek;
  const sunday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysUntilSunday);

  const nthWeek = Math.ceil(sunday.getDate() / 7);

  const dotsContainer = document.getElementById('week-dots');
  if (!dotsContainer) return;

  let dotsHtml = '';
  for (let i = 1; i <= 5; i++) {
    const color = (i % 2 !== 0) ? '#0077B6' : '#FF4500';
    const opacity = (i === nthWeek) ? '1' : '0.2';
    const scale = (i === nthWeek) ? 'scale(1.2)' : 'scale(1)';

    dotsHtml += `<div style="width: 6px; height: 6px; border-radius: 50%; background-color: ${color}; opacity: ${opacity}; transform: ${scale}; transition: all 0.3s ease;"></div>`;
  }
  dotsContainer.innerHTML = dotsHtml;
}

function toggleMedication() {
  const titleEl = document.getElementById('log-it-title');
  const nextState = !titleEl.classList.contains('rainbow-theme');
  titleEl.classList.toggle('rainbow-theme');
  fetch(`${GAS_URL}?action=toggleMedication&state=${nextState}`).then(() => loadData());
}

// 📌 REMINDERS 버튼 클릭 시 접기/펴기 (토글)
function toggleReminders() {
  const list = document.getElementById('todo-list');
  list.classList.toggle('expanded-view');
}

function loadData() {
  fetch(`${GAS_URL}?action=getData&_t=${Date.now()}`).then(res => res.json()).then(res => {
    if(res.status === 'success') {
      const d = res.data;
      const titleEl = document.getElementById('log-it-title');
      if (d.isMedicationTaken) titleEl.classList.add('rainbow-theme');
      else titleEl.classList.remove('rainbow-theme');

      document.getElementById('fuel-status').innerHTML = `<span class="status-main">${d.fuel} / 3회</span>`;
      const rDate = d.robotDate ? d.robotDate.substring(5).replace('-','/') : "날짜";
      document.getElementById('robot-status').innerHTML = `<span class="status-main">${d.robot} / 2회</span><span class="status-sub">(${rDate})</span>`;
      document.getElementById('carwash-status').innerHTML = `<span class="status-main" style="white-space: nowrap; font-size: 15px; letter-spacing: -0.5px;">${(d.carWash || 0).toLocaleString()}원/12,000원</span>`;
      document.getElementById('hair-status').innerHTML = getHaircutStatus(d.hairCutDate);
    }
  });
}

function loadTodos(){
  fetch(`${GAS_URL}?action=getTodos&_t=${Date.now()}`).then(res => res.json()).then(res => {
    const list = document.getElementById('todo-list'); list.innerHTML = '';
    const todos = res.todos.list;
    const highlighted = res.todos.highlighted;

    [...todos].reverse().forEach((text, i) => {
      const div = document.createElement('div');
      div.className = 'todo-item' + (highlighted.includes(text) ? ' highlighted' : '');
      div.innerHTML = `<span class="drag-handle">☰</span><span class="text">${text}</span><button onclick="deleteTodo(${todos.length - 1 - i}, this)">삭제</button>`;

      const handle = div.querySelector('.drag-handle');
      handle.onclick = (e) => {
        e.stopPropagation();
        div.classList.toggle('highlighted');
        if(navigator.vibrate) navigator.vibrate(50);
        fetch(`${GAS_URL}?action=toggleHighlight&text=${encodeURIComponent(text)}`);
      };

      const textField = div.querySelector('.text');
      textField.onclick = (e) => {
        e.stopPropagation();
        div.classList.toggle('expanded');
      };

      list.appendChild(div);
    });
    new Sortable(list, { handle: '.drag-handle', animation: 150, onEnd: saveOrder });
  });
}

function recordAction(action, btn){ 
  btn.disabled = true; 
  btn.classList.add('loading');
  fetch(`${GAS_URL}?action=${action}`).then(res => res.json()).then(data => {
    btn.disabled = false;
    btn.classList.remove('loading');
    if(data.message) alert(data.message); 
    loadData(); 
  }); 
}

function recordHairCut(){ const v = document.getElementById('hairDateVal').value; if(!v) return; fetch(`${GAS_URL}?action=setHairCut&dateVal=${v}`).then(() => loadData()); }
function recordCarWash(){ const a = prompt("차감할 금액:"); if (a) fetch(`${GAS_URL}?action=useCarWash&amount=${a.replace(/[^0-9]/g, '')}`).then(() => loadData()); }

function addTodo(btn){ 
  const v = document.getElementById('todo-input').value; 
  if(!v) return; 
  btn.disabled=true; 
  btn.classList.add('loading-add');
  fetch(`${GAS_URL}?action=addTodo&text=${encodeURIComponent(v)}`).then(() => { 
    btn.disabled=false; 
    btn.classList.remove('loading-add'); 
    document.getElementById('todo-input').value=''; 
    loadTodos(); 
  }); 
}

function deleteTodo(idx, btn){ 
  btn.disabled=true; 
  btn.classList.add('loading-del');
  fetch(`${GAS_URL}?action=deleteTodo&index=${idx}`).then(() => loadTodos()); 
}

function saveOrder() { 
  const items = Array.from(document.querySelectorAll('.todo-item span.text')).map(s => s.innerText).reverse();
  fetch(`${GAS_URL}?action=updateTodoOrder&data=${encodeURIComponent(JSON.stringify(items))}`);
}

function getHaircutStatus(dStr) {
  if (!dStr) return `<span class="status-main">기록 없음</span><span class="status-sub">(날짜 미지정)</span>`;
  const diff = Math.floor((new Date() - new Date(dStr.replace(/[.\s]+/g, '-'))) / 86400000);
  return `<span class="status-main">D+${diff}</span><span class="status-sub">(${Math.floor(diff/7)+1}주차)</span>`;
}
